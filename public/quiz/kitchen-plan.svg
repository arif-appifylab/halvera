<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="t d">
  <title id="t">Plan of the teaching kitchen</title>
  <desc id="d">The entrance is in the middle of the bottom wall. A is just inside the entrance on the left. E is just inside the entrance on the right. C is in the middle of the room. B is in the top left corner and D is in the top right corner. F is outside, through a door in the right-hand wall.</desc>
  <rect width="640" height="440" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#1f2a24">
    <rect x="40" y="30" width="440" height="360" fill="#f6f2ea" stroke="#1f2a24" stroke-width="4"/>
    <!-- entrance gap in the bottom wall -->
    <rect x="225" y="384" width="70" height="12" fill="#ffffff"/>
    <text x="260" y="425" font-size="18" text-anchor="middle">Entrance</text>
    <!-- door in the right wall -->
    <rect x="474" y="185" width="12" height="60" fill="#ffffff"/>
    <g font-size="34" font-weight="700" text-anchor="middle">
      <rect x="62" y="52" width="110" height="80" rx="10" fill="#dfe9e2" stroke="#2f5d4a" stroke-width="2"/><text x="117" y="104">B</text>
      <rect x="348" y="52" width="110" height="80" rx="10" fill="#dfe9e2" stroke="#2f5d4a" stroke-width="2"/><text x="403" y="104">D</text>
      <rect x="185" y="170" width="150" height="80" rx="10" fill="#dfe9e2" stroke="#2f5d4a" stroke-width="2"/><text x="260" y="222">C</text>
      <rect x="62" y="288" width="110" height="80" rx="10" fill="#dfe9e2" stroke="#2f5d4a" stroke-width="2"/><text x="117" y="340">A</text>
      <rect x="348" y="288" width="110" height="80" rx="10" fill="#dfe9e2" stroke="#2f5d4a" stroke-width="2"/><text x="403" y="340">E</text>
      <rect x="515" y="170" width="100" height="90" rx="10" fill="#e9f0d8" stroke="#2f5d4a" stroke-width="2" stroke-dasharray="6 5"/><text x="565" y="226">F</text>
    </g>
    <text x="565" y="285" font-size="16" text-anchor="middle">Outside</text>
  </g>
</svg>
